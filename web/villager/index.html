<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="आहट: हिमनद झील बाढ़ चेतावनी — क्या आपका गाँव बाढ़ मार्ग में है? Glacial lake flood warnings for Himachal villages." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Same faces as the officials' dashboard. Loaded without blocking the first
         paint; offline (or before they arrive) the phone's own fonts are used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Theme before the first paint (no flash): the saved choice, else the
         device's. Keep in step with src/theme.ts and the tokens in src/styles.css. -->
    <style>
      html { background: #f5f7fa; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0c131d; } }
      html[data-theme='dark'] { background: #0c131d; }
    </style>
    <script>
      (function () {
        var t = null;
        try { t = JSON.parse(localStorage.getItem('aahat:theme')); } catch (e) {}
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else { try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; } }
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0f1722' : '#ffffff');
      })();
    </script>
    <title>आहट — बाढ़ चेतावनी</title>
  </head>
  <body>
    <div id="app">
      <noscript>आहट चलाने के लिए JavaScript चालू करें। Please enable JavaScript to use Aahat.</noscript>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
