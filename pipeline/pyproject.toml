[project]
name = "aahat"
version = "0.1.0"
description = "Aahat pipeline: Sentinel-2 glacial lake monitoring, terrain, risk and downstream routing"
authors = [
    { name = "ayush00git", email = "ayush.2007.iit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
aahat = "aahat.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["aahat.water.WaterParams", "WaterParams", "aahat.laketerrain.TerrainParams", "TerrainParams", "aahat.downstream.DownstreamParams", "DownstreamParams"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
